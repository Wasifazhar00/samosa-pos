name: Build APK and Windows EXE

on:
  workflow_dispatch:

jobs:
  # 1. BUILD ANDROID APK
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Automatically generate android platform configuration files
      - name: Create Android Platform Files
        run: flutter create . --platforms=android --org com.samosapos.app

      - run: flutter pub get
      
      - run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Samosa-POS-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  # 2. BUILD WINDOWS EXE
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter config --enable-windows-desktop

      # Automatically generate windows platform configuration files
      - name: Create Windows Platform Files
        run: flutter create . --platforms=windows --org com.samosapos.app

      - run: flutter pub get

      - run: flutter build windows --release

      - name: Upload Windows EXE Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Samosa-POS-Windows-EXE
          path: build/windows/x64/runner/Release/
